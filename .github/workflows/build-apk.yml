name: Build TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runner 已预装 Android SDK（含 cmdline-tools），无需 setup-android。
      - name: Install Android SDK 36
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Verify (JVM tests + lint)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      # 第一版用 debug 签名，APK 可直接安装。需覆盖官方 v1.4.0 时先卸载（签名不同）。
      # 后续可改自有 keystore + assembleRelease：keystore base64 存 Secrets，
      # 在 gradle 的 .signing/ 下还原（build.gradle.kts 已支持 .signing/signing.properties）。
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: libretv-tv-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
